name: iOS

# Gera o app de iPhone (Capacitor) a partir do mesmo jogo web, num Mac do GitHub. O site não muda.
# - Sempre: compila para o simulador, abre o app num iPhone simulado e tira uma foto da tela (prova que roda),
#   e gera um .ipa sem assinatura (artefatos "zumbi-bot-ios-simulador" e "zumbi-bot-ios-sem-assinatura").
# - Com os segredos da Apple (conta de desenvolvedor): assina e envia para o TestFlight. Ver docs/APP_STORE.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' && secrets.APPLE_PROVISIONING_PROFILE_BASE64 != '' && secrets.APPSTORE_API_KEY_P8_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - name: Versão
        # 1.2.<número da execução>, a partir da versão do package.json (o número da compilação é o da execução)
        run: |
          echo "VERSION_NAME=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Build do jogo para o app e cópia para o projeto iOS
        run: npm run ios:sync

      - name: Compilar para o simulador
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build | tail -n 40
          test -d build/Build/Products/Debug-iphonesimulator/App.app
          mkdir -p ../../out
          (cd build/Build/Products/Debug-iphonesimulator && zip -qry ../../../../../../out/zumbi-bot-simulador.zip App.app)

      - name: Abrir o app num iPhone simulado e fotografar a tela
        # prova extra (a compilação acima é a verificação principal): as imagens de simulador variam entre os Macs
        continue-on-error: true
        working-directory: ios/App
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8")).devices;
            const ios = Object.keys(d).filter((k) => k.includes("iOS")).sort().reverse();
            for (const k of ios) {
              const p = d[k].find((x) => /^iPhone \d+( Pro)?$/.test(x.name)) ?? d[k].find((x) => x.name.startsWith("iPhone"));
              if (p) { console.log(p.udid); break; }
            }')
          echo "iPhone simulado: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/App.app
          xcrun simctl launch "$UDID" io.github.marcelojaloto.zumbibot
          sleep 45
          xcrun simctl io "$UDID" screenshot ../../out/simulador.png
          # o app continua aberto (não fechou por erro)
          xcrun simctl spawn "$UDID" launchctl list | grep zumbibot

      - name: .ipa sem assinatura (para assinar depois)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build | tail -n 40
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry ../../out/zumbi-bot-sem-assinatura.ipa Payload
          ls -la ../../out

      - uses: actions/upload-artifact@v4
        with:
          name: zumbi-bot-ios-simulador
          path: |
            out/simulador.png
            out/zumbi-bot-simulador.zip
          retention-days: 30
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: zumbi-bot-ios-sem-assinatura
          path: out/zumbi-bot-sem-assinatura.ipa
          retention-days: 30

      # ------------------------------------------------------------------ com a conta Apple: TestFlight
      - name: Certificado e perfil de distribuição
        if: env.HAS_APPLE == 'true'
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/zb.keychain-db"
          KC_PASS=$(openssl rand -hex 16)
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/zb.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/zb.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          echo "PROFILE_NAME=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")" >> "$GITHUB_ENV"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp "$RUNNER_TEMP/zb.mobileprovision" "$d/$UUID.mobileprovision"
          done
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Assinar e enviar para o TestFlight
        if: env.HAS_APPLE == 'true'
        working-directory: ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPSTORE_API_KEY_P8_BASE64 }}
        run: |
          # assinatura manual só no app (os pacotes do Capacitor não aceitam perfil de provisionamento)
          node -e '
            const fs = require("fs");
            const p = "App.xcodeproj/project.pbxproj";
            const sign = `CODE_SIGN_STYLE = Manual; DEVELOPMENT_TEAM = ${process.env.TEAM_ID}; ` +
              `PROVISIONING_PROFILE_SPECIFIER = "${process.env.PROFILE_NAME}"; "CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";`;
            fs.writeFileSync(p, fs.readFileSync(p, "utf8").replaceAll("CODE_SIGN_STYLE = Automatic;", sign));'
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION="$VERSION_NAME" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            archive | tail -n 40
          echo "$KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>io.github.marcelojaloto.zumbibot</key><string>$PROFILE_NAME</string>
            </dict>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" -allowProvisioningUpdates
          echo "Enviado ao TestFlight: versão $VERSION_NAME ($BUILD_NUMBER)"

      - name: Limpar a chave
        if: always() && env.HAS_APPLE == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/zb.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/zb.mobileprovision"
